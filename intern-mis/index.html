<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intern Multi-Program Performance</title>
<style>
  :root{
    --purple-1:#4b2e6f; --purple-2:#7a4fa3;
    --ink:#1f1730; --ink-soft:#6b6478;
    --bg:#f7f5fa; --card:#ffffff; --line:#e8e3f0;
    --green:#1c8a5a; --red:#c23b3b;
    --amber:#b8790f; --amber-bg:#fdf3e2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink);}
  .wrap{max-width:980px; margin:0 auto; padding:0 20px 60px;}
  header.hero{background:linear-gradient(120deg,var(--purple-1),var(--purple-2)); color:#fff; padding:32px 20px; margin-bottom:24px;}
  header.hero .inner{max-width:980px; margin:0 auto;}
  header.hero h1{margin:0 0 6px; font-size:26px; font-weight:700;}
  header.hero .sub{opacity:.85; font-size:14px;}

  .controls{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:18px;
  }
  button{font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; border-radius:8px; border:1px solid var(--line); padding:9px 16px; background:#fff; color:var(--ink);}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .field input[type=date]{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink);}
  button.primary{background:var(--purple-1); color:#fff; border-color:var(--purple-1);}
  button.quiet{background:var(--bg);}
  button.active{background:var(--purple-1); color:#fff; border-color:var(--purple-1);}
  .status-row{display:flex; align-items:center; gap:8px; margin-left:auto; font-size:13px; color:var(--ink-soft);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block;}
  .dot.err{background:var(--red);}

  .tabs{display:flex; gap:8px; margin-bottom:18px;}
  .tabs button{padding:9px 20px;}

  .summary{display:flex; gap:24px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px; margin-bottom:18px; font-size:14px;}
  .summary b{font-size:17px;}

  .alert{border-radius:var(--radius); padding:14px 18px; margin-bottom:14px; font-size:14px; border:1px solid;}
  .alert.amber{background:var(--amber-bg); border-color:#efd7a3; color:#7a5209;}
  .alert summary{cursor:pointer; font-weight:600;}
  .alert ul{margin:8px 0 0; padding-left:18px;}
  .alert li{margin-bottom:3px;}

  .list-head{display:grid; grid-template-columns: 1.6fr .8fr .8fr 1.4fr; gap:10px; padding:0 20px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;}
  .row{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden;}
  .row-main{display:grid; grid-template-columns: 1.6fr .8fr .8fr 1.4fr; gap:10px; align-items:center; padding:14px 20px;}
  .row-main.clickable{cursor:pointer;}
  .row-main.clickable:hover{background:#fbfaff;}
  .name{font-weight:600; font-size:15px;}
  .name .tag{font-size:12px; color:var(--ink-soft); font-weight:400; margin-left:8px;}
  .pct{font-weight:700; font-size:15px;}
  .pct.green{color:var(--green);}
  .pct.red{color:var(--red);}
  .pct .frac{font-size:11px; color:var(--ink-soft); font-weight:400; margin-left:4px;}
  .bar{height:5px; border-radius:3px; background:var(--line); margin-top:5px; overflow:hidden;}
  .bar > span{display:block; height:100%; background:var(--green);}
  .bar.red > span{background:var(--red);}
  .counts{display:flex; gap:10px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
  .counts b{color:var(--ink); font-weight:600;}

  .breakdown{display:none; border-top:1px solid var(--line); background:#fbfaff; padding:6px 20px 14px;}
  .breakdown.open{display:block;}
  .prog-row{display:grid; grid-template-columns: 1.6fr .8fr .8fr 1.4fr; gap:10px; align-items:center; padding:9px 0; font-size:13px; border-bottom:1px dashed var(--line);}
  .prog-row:last-child{border-bottom:none;}
  .prog-name{color:var(--ink-soft);}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-soft);}
  .quarterly-note{font-size:11px; color:var(--ink-soft); font-style:italic;}
</style>
</head>
<body>

<header class="hero">
  <div class="inner">
    <h1>Intern Multi-Program Performance</h1>
    <div class="sub" id="rangeLabel">Loading…</div>
  </div>
</header>

<div class="wrap">

  <div class="controls">
    <div class="field">
      <label>From</label>
      <input type="date" id="fromDate">
    </div>
    <div class="field">
      <label>To</label>
      <input type="date" id="toDate">
    </div>
    <button class="quiet active" id="todayBtn">Today</button>
    <button class="quiet" id="lastWeekBtn">Last week</button>
    <button class="primary" id="refreshBtn">Refresh</button>
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">—</span>
    </div>
  </div>

  <div class="tabs">
    <button class="active" id="teamTabBtn">Team</button>
    <button id="individualTabBtn">Individual</button>
  </div>

  <div id="alertsArea"></div>

  <div class="summary" id="summaryBar">Loading summary…</div>

  <div id="teamView">
    <div class="list-head">
      <div>Program</div><div>Done</div><div>On Time</div><div>Connected / DNP / Call Later</div>
    </div>
    <div id="teamListArea"><div class="empty">Loading…</div></div>
  </div>

  <div id="individualView" style="display:none;">
    <div class="list-head">
      <div>Intern</div><div>Done</div><div>On Time</div><div>Connected / DNP / Call Later</div>
    </div>
    <div id="individualListArea"><div class="empty">Loading…</div></div>
  </div>

</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzF3xXsvcJOLWi0p9ewTcTUSRf2bwFitEtkMXfj2EBoCVvDrh7cQyOGOryr1Smoow/exec';

  const PROGRAM_ORDER = ['UTW Invitation','Day 1 Attendees','Day 2 Attendees','Reiki Invitation Calls FMS','TMR'];

  const fromDateHolder = document.getElementById('fromDate');
  const toDateHolder = document.getElementById('toDate');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const rangeLabel = document.getElementById('rangeLabel');
  const summaryBar = document.getElementById('summaryBar');
  const alertsArea = document.getElementById('alertsArea');
  const teamListArea = document.getElementById('teamListArea');
  const individualListArea = document.getElementById('individualListArea');
  const todayBtn = document.getElementById('todayBtn');
  const lastWeekBtn = document.getElementById('lastWeekBtn');
  const teamTabBtn = document.getElementById('teamTabBtn');
  const individualTabBtn = document.getElementById('individualTabBtn');
  const teamView = document.getElementById('teamView');
  const individualView = document.getElementById('individualView');

  function fmt(d){ return d.toISOString().slice(0,10); }

  function setToday(){
    const t = new Date();
    fromDateHolder.value = fmt(t);
    toDateHolder.value = fmt(t);
    todayBtn.classList.add('active');
    lastWeekBtn.classList.remove('active');
  }
  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function setLastWeek(){
    const thisMonday = getMonday(new Date());
    const lastMonday = new Date(thisMonday); lastMonday.setDate(lastMonday.getDate() - 7);
    const lastSunday = new Date(thisMonday); lastSunday.setDate(lastSunday.getDate() - 1);
    fromDateHolder.value = fmt(lastMonday);
    toDateHolder.value = fmt(lastSunday);
    lastWeekBtn.classList.add('active');
    todayBtn.classList.remove('active');
  }
  function displayDate(iso){
    return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  function pctClass(p){ return (p === null || p === undefined) ? '' : (p >= 90 ? 'green' : 'red'); }

  function showTab(tab){
    if (tab === 'team'){
      teamView.style.display = '';
      individualView.style.display = 'none';
      teamTabBtn.classList.add('active');
      individualTabBtn.classList.remove('active');
    } else {
      teamView.style.display = 'none';
      individualView.style.display = '';
      individualTabBtn.classList.add('active');
      teamTabBtn.classList.remove('active');
    }
  }

  async function loadData(){
    statusDot.className = 'dot';
    statusText.textContent = 'Loading…';
    teamListArea.innerHTML = '<div class="empty">Loading…</div>';
    individualListArea.innerHTML = '<div class="empty">Loading…</div>';
    alertsArea.innerHTML = '';

    const start = fromDateHolder.value, end = toDateHolder.value;
    try{
      const res = await fetch(`${SCRIPT_URL}?start=${start}&end=${end}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      render(data);
      statusDot.className = 'dot';
      statusText.textContent = 'Live — data is current';
    }catch(err){
      statusDot.className = 'dot err';
      statusText.textContent = 'Error loading data';
      teamListArea.innerHTML = `<div class="empty">Could not load data: ${err.message}</div>`;
      individualListArea.innerHTML = '';
    }
  }

  function render(data){
    rangeLabel.textContent = `${displayDate(data.range.start)} – ${displayDate(data.range.end)}`;

    const totalDoers = data.doers.length;
    const totalPlanned = data.doers.reduce((s,d)=>s+d.combined.planned,0);
    const totalActual = data.doers.reduce((s,d)=>s+d.combined.actual,0);
    const overallDone = totalPlanned ? Math.round(1000*totalActual/totalPlanned)/10 : 0;
    summaryBar.innerHTML = `
      <div><b>${totalDoers}</b> interns active</div>
      <div><b>${totalActual}</b> / ${totalPlanned} calls made</div>
      <div>Overall done <b>${overallDone}%</b></div>
    `;

    let alertsHtml = '';
    if (data.dataIssues && data.dataIssues.length){
      alertsHtml += `<div class="alert amber"><details><summary>⚠ ${data.dataIssues.length} data issue(s) in this range</summary>
        <ul>${data.dataIssues.slice(0,50).map(i=>`<li>${i.program} (row ${i.row}) — ${i.issue}${i.doer && i.doer !== '(blank)' ? ' — ' + i.doer : ''}</li>`).join('')}
        ${data.dataIssues.length>50 ? `<li>…and ${data.dataIssues.length-50} more</li>` : ''}</ul>
      </details></div>`;
    }
    alertsArea.innerHTML = alertsHtml;

    // ---- Team tab: program-level totals, no names ----
    teamListArea.innerHTML = data.programs.map(p => {
      const m = p.metrics;
      const noData = m.planned === 0;
      if (noData){
        return `
          <div class="row">
            <div class="row-main">
              <div class="name">${p.name}</div>
              <div colspan="3" class="empty" style="padding:0; text-align:left;">
                ${p.isQuarterly ? '<span class="quarterly-note">No data — expected between quarterly cycles</span>' : 'No data in this range'}
              </div>
            </div>
          </div>`;
      }
      const donePct = m.donePct ?? 0, otPct = m.onTimePct ?? 0;
      return `
        <div class="row">
          <div class="row-main">
            <div class="name">${p.name}</div>
            <div>
              <div class="pct ${pctClass(m.donePct)}">${donePct}%<span class="frac">${m.actual}/${m.planned}</span></div>
              <div class="bar ${pctClass(m.donePct)==='red'?'red':''}"><span style="width:${donePct}%"></span></div>
            </div>
            <div>
              <div class="pct ${pctClass(m.onTimePct)}">${m.onTimePct ?? '—'}${m.onTimePct!==null?'%':''}<span class="frac">${m.onTime}/${m.planned}</span></div>
              <div class="bar ${pctClass(m.onTimePct)==='red'?'red':''}"><span style="width:${otPct}%"></span></div>
            </div>
            <div class="counts">
              <span><b>${m.connected}</b> Connected</span>
              <span><b>${m.dnp}</b> DNP</span>
              <span><b>${m.callLater}</b> Call Later</span>
            </div>
          </div>
        </div>`;
    }).join('');

    // ---- Individual tab: per-person, alphabetical, expandable per-program breakdown ----
    if (!data.doers.length){
      individualListArea.innerHTML = '<div class="empty">No activity in this date range.</div>';
      return;
    }

    individualListArea.innerHTML = data.doers.map((d, idx) => {
      const c = d.combined;
      const donePct = c.donePct ?? 0, otPct = c.onTimePct ?? 0;
      const progsPresent = PROGRAM_ORDER.filter(p => d.programs[p]);

      const breakdownRows = progsPresent.map(p => {
        const m = d.programs[p];
        return `
          <div class="prog-row">
            <div class="prog-name">${p}</div>
            <div class="pct ${pctClass(m.donePct)}">${m.donePct ?? '—'}${m.donePct!==null?'%':''} <span class="frac">${m.actual}/${m.planned}</span></div>
            <div class="pct ${pctClass(m.onTimePct)}">${m.onTimePct ?? '—'}${m.onTimePct!==null?'%':''} <span class="frac">${m.onTime}/${m.planned}</span></div>
            <div class="counts"><span><b>${m.connected}</b> Conn</span><span><b>${m.dnp}</b> DNP</span><span><b>${m.callLater}</b> CL</span></div>
          </div>`;
      }).join('');

      return `
        <div class="row">
          <div class="row-main clickable" onclick="document.getElementById('bd-${idx}').classList.toggle('open')">
            <div class="name">${d.name}<span class="tag">${progsPresent.length} program${progsPresent.length!==1?'s':''}</span></div>
            <div>
              <div class="pct ${pctClass(c.donePct)}">${donePct}%<span class="frac">${c.actual}/${c.planned}</span></div>
              <div class="bar ${pctClass(c.donePct)==='red'?'red':''}"><span style="width:${donePct}%"></span></div>
            </div>
            <div>
              <div class="pct ${pctClass(c.onTimePct)}">${c.onTimePct ?? '—'}${c.onTimePct!==null?'%':''}<span class="frac">${c.onTime}/${c.planned}</span></div>
              <div class="bar ${pctClass(c.onTimePct)==='red'?'red':''}"><span style="width:${otPct}%"></span></div>
            </div>
            <div class="counts">
              <span><b>${c.connected}</b> Connected</span>
              <span><b>${c.dnp}</b> DNP</span>
              <span><b>${c.callLater}</b> Call Later</span>
            </div>
          </div>
          <div class="breakdown" id="bd-${idx}">${breakdownRows}</div>
        </div>`;
    }).join('');
  }

  todayBtn.onclick = () => { setToday(); loadData(); };
  lastWeekBtn.onclick = () => { setLastWeek(); loadData(); };
  document.getElementById('refreshBtn').onclick = loadData;
  teamTabBtn.onclick = () => showTab('team');
  individualTabBtn.onclick = () => showTab('individual');
  [fromDateHolder, toDateHolder].forEach(input => {
    input.addEventListener('change', () => {
      todayBtn.classList.remove('active');
      lastWeekBtn.classList.remove('active');
    });
  });

  setToday();
  loadData();
</script>

</body>
</html>
